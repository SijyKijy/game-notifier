name: games-notifier

on:
    schedule:
        - cron: "0 * * * *" # hourly
    workflow_dispatch: # allows manual triggering
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo content
              uses: actions/checkout@v2

            - name: setup python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.15" # install the python version needed
                  cache: pip
                  cache-dependency-path: requirements.txt

            - name: setup node
              if: vars.DESC_PROVIDER == 'claude'
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: get claude code version
              if: vars.DESC_PROVIDER == 'claude'
              id: claude-version
              run: |
                  version=$(npm view @anthropic-ai/claude-code version)
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: cache npm packages
              if: vars.DESC_PROVIDER == 'claude'
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-${{ runner.arch }}-node20-claude-${{ steps.claude-version.outputs.version }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-node20-claude-

            - name: install claude code cli
              if: vars.DESC_PROVIDER == 'claude'
              env:
                  CLAUDE_VERSION: ${{ steps.claude-version.outputs.version }}
              run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_VERSION" --prefer-offline --no-audit --no-fund

            - name: install python packages
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: execute py script # run main.py
              env:
                GIST_ID: ${{ secrets.GIST_ID }}
                GH_TOKEN: ${{ secrets.GH_TOKEN }}
                WEBHOOKS_PATH: ${{ secrets.WEBHOOKS_PATH }}
                PERP_TOKEN: ${{ secrets.PERP_TOKEN }}
                PERP_MODEL: ${{ vars.PERP_MODEL }}
                PERP_PROMPT: ${{ vars.PERP_PROMPT }}
                PERP_URL: ${{ vars.PERP_URL }}
                DESC_PROVIDER: ${{ vars.DESC_PROVIDER }}
                CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                CLAUDE_PROMPT: ${{ vars.CLAUDE_PROMPT }}
                CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
              run: python main.py
